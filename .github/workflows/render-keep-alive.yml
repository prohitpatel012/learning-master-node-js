
name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Check Render application
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "ERROR: RENDER_HEALTH_URL variable is missing"
            exit 1
          fi

          echo "Health check URL is configured"

          curl \
            --location \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 10 \
            --max-time 60 \
            "$RENDER_HEALTH_URL"

          echo ""
          echo "Render health check completed successfully"
