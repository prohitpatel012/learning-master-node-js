
name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Check Render application
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL is not configured"
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 30 \
            "$RENDER_HEALTH_URL"

          echo "Render health check completed successfully"
